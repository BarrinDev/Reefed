# Gerado a partir de logs reais do PostgreSQL 17, MySQL 8.4 e MariaDB 11.4 (e variações).
# Formato descrito em tests/run_tests.py.
name: Execução de comandos, leitura de arquivos e adulteração de logs
cases:
- name: COPY ... TO PROGRAM
  log: '2026-10-22 13:10:37.857 UTC [103] user=postgres db=postgres client=172.18.0.4 app=psql LOG:  statement: COPY (SELECT 1) TO PROGRAM ''cat > /dev/null'';'
  expect:
    rule: 110700
    level: 13
    mitre:
    - T1059
    - T1059.004
- name: COPY ... FROM PROGRAM
  log: '2026-10-22 14:05:10.120 UTC [4242] user=postgres db=loja client=10.20.0.15 app=psql LOG:  statement: COPY saida FROM PROGRAM ''id'';'
  expect:
    rule: 110700
- name: Função em plpython3u
  log: '2026-10-22 14:05:10.120 UTC [4242] user=postgres db=loja client=10.20.0.15 app=psql LOG:  statement: CREATE FUNCTION sh(cmd text) RETURNS text AS $$ import os; return os.popen(cmd).read() $$ LANGUAGE plpython3u;'
  expect:
    rule: 110701
    level: 13
    mitre:
    - T1505.001
- name: Função com LANGUAGE antes do corpo
  log: '2026-10-22 14:05:10.120 UTC [4242] user=postgres db=loja client=10.20.0.15 app=psql LOG:  statement: CREATE OR REPLACE FUNCTION x() RETURNS void LANGUAGE c AS ''/tmp/evil.so'', ''run'';'
  expect:
    rule: 110701
- name: Função SQL comum é só DDL
  log: '2026-10-22 14:05:10.120 UTC [4242] user=postgres db=loja client=10.20.0.15 app=psql LOG:  statement: CREATE FUNCTION soma(a int, b int) RETURNS int AS $$ SELECT a + b; $$ LANGUAGE sql;'
  expect:
    rule: 110407
- name: 'MySQL: UDF com SONAME'
