  expect:
    rule: 110701
- name: Extensão perigosa
  log: '2026-10-22 14:05:10.120 UTC [4242] user=postgres db=loja client=10.20.0.15 app=psql LOG:  statement: CREATE EXTENSION plpython3u;'
  expect:
    rule: 110702
    level: 10
- name: 'MySQL: plugin instalado'
  log: '# Time: 2026-10-22T14:05:10.654784Z # User@Host: root[root] @  [10.20.0.16]  Id:    31 # Query_time: 0.000200  Lock_time: 0.000000 Rows_sent: 0  Rows_examined: 0 Thread_id: 31 Errno: 0 Killed: 0 Bytes_received: 43 Bytes_sent: 49 Read_first: 0 Read_last: 0 Read_key: 0 Read_next: 0 Read_prev: 0 Read_rnd: 0 Read_rnd_next: 0 Sort_merge_passes: 0 Sort_range_count: 0 Sort_rows: 0 Sort_scan_count: 0 Created_tmp_disk_tables: 0 Created_tmp_tables: 0 Start: 2026-10-22T14:05:10.654584Z End: 2026-10-22T14:05:10.654784Z SET timestamp=1792680310; INSTALL PLUGIN server_audit SONAME ''server_audit.so'';'
  expect:
    rule: 110703
    level: 10
- name: Trigger criada por administrador
  log: '2026-10-22 14:05:10.120 UTC [4242] user=postgres db=loja client=10.20.0.15 app=psql LOG:  statement: CREATE TRIGGER t_audit AFTER INSERT ON pedidos FOR EACH ROW EXECUTE FUNCTION registra();'
  expect:
    rule: 110704
    level: 5
- name: Evento agendado criado por usuário comum
