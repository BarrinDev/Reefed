- name: 'PostgreSQL: SET log_statement = none'
  log: '2026-10-22 13:10:37.883 UTC [103] user=postgres db=postgres client=172.18.0.4 app=psql LOG:  statement: SET log_statement = ''none'';'
  expect:
    rule: 110730
    level: 12
    mitre:
    - T1562.001
    groups:
    - reefed_tamper
