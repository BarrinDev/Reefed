      source: app
      app: loja
      event: access_denied
      message: GET /admin/usuarios
      records: 0
      role: ''
    srcip: 203.0.113.10
    dstuser: ana
  expect:
    rule: 110154
    level: 5
- name: Muitos acessos negados para o mesmo usuário
  log_format: json
