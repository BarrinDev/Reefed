# Gerado a partir de logs reais do PostgreSQL 17, MySQL 8.4 e MariaDB 11.4 (e variações).
# Formato descrito em tests/run_tests.py.
name: Eventos enviados pela aplicação (JSON)
cases:
- name: Login no sistema
  log_format: json
  log:
    reefed:
      source: app
      app: loja
      event: login_success
      message: ''
      records: 0
      role: ''
    srcip: 203.0.113.10
    dstuser: ana
  expect:
    decoder: json
    rule: 110151
    level: 3
    fields:
      reefed.app: loja
      dstuser: ana
      srcip: 203.0.113.10
- name: Falha de login no sistema
  log_format: json
  log:
    reefed:
      source: app
      app: loja
      event: login_failed
      message: senha incorreta
      records: 0
      role: ''
    srcip: 203.0.113.10
    dstuser: ana
  expect:
    rule: 110152
    level: 5
    mitre:
    - T1110.001
- name: Força bruta na tela de login (6 falhas do mesmo IP)
  log_format: json
  steps:
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.10
      dstuser: ana
    repeat: 5
    expect:
      rule: 110152
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.10
      dstuser: bruno
    expect:
      rule: 110153
      level: 10
      mitre:
      - T1110
- name: Falhas de IPs diferentes não somam
  log_format: json
  steps:
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.11
      dstuser: ana
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.12
      dstuser: ana
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.13
      dstuser: ana
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.14
      dstuser: ana
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.15
      dstuser: ana
  - log:
      reefed:
        source: app
        app: loja
        event: login_failed
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.16
      dstuser: ana
    expect:
      rule: 110152
- name: Acesso negado
  log_format: json
  log:
