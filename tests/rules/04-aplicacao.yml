        source: app
        app: loja
        event: access_denied
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.10
      dstuser: ana
    repeat: 7
    expect:
      rule: 110154
  - log:
      reefed:
        source: app
        app: loja
        event: access_denied
        message: ''
        records: 0
        role: ''
      srcip: 203.0.113.99
      dstuser: ana
    expect:
      rule: 110155
      level: 10
      mitre:
      - T1068
