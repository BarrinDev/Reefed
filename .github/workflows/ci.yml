# Reefed - testes automáticos a cada push e pull request.
#
#   arquivos   XML das regras/decoders, shellcheck, Python e clientes da API compilam, compose válido
#   python     testes da API, das integrações de alerta e dos caminhos do FIM (pytest)
#   regras     sobe um Wazuh manager com as regras do Reefed e roda tests/run_tests.py
#   windows    instalador do agente Windows: análise estática, testes e instalação de
#              verdade num Windows do GitHub (MSI do Wazuh + PostgreSQL do runner)
#   laboratório (manual, em Actions > CI > Run workflow): stack completo + ataques
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      laboratorio:
        description: "Rodar também o laboratório completo (uns 20 minutos)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  WAZUH_VERSION: "4.14.9"

jobs:
  arquivos:
    name: Arquivos (XML, shell, Python, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: XML das regras, decoders e configurações
        run: python3 tests/lint_xml.py

      - name: Catálogo de regras (docs/regras.md) e painéis (dashboards/reefed.ndjson) em dia
        run: |
          python3 docs/gerar_regras.py --check
          python3 dashboards/gerar_paineis.py "$RUNNER_TEMP/reefed.ndjson"
          cmp dashboards/reefed.ndjson "$RUNNER_TEMP/reefed.ndjson" || {
            echo "dashboards/reefed.ndjson difere do gerador: rode python3 dashboards/gerar_paineis.py"; exit 1; }

      - name: shellcheck
        run: |
          shellcheck -x setup.sh scripts/*.sh agents/linux/install-agent.sh \
            config/wazuh_manager/entrypoint/10-reefed.sh lab/agent/10-reefed-lab.sh lab/agent/iptables \
            wazuh/integrations/custom-reefed-telegram wazuh/integrations/custom-reefed-slack \
            wazuh/integrations/custom-reefed-email

      - name: Python compila
        run: python3 -m compileall -q api config/reefed-init dashboards docs lab tests wazuh/integrations

      - name: Clientes da API em JavaScript, Java e PHP compilam
        run: |
          node --check api/client/reefed.mjs
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/java" api/client/Reefed.java
          php -l api/client/reefed.php

      - name: docker compose válido
        run: |
          cp .env.example .env
          for name in INDEXER_PASSWORD DASHBOARD_PASSWORD WAZUH_API_PASSWORD REEFED_API_INDEXER_PASSWORD \
                      REEFED_API_KEY REEFED_ENROLLMENT_PASSWORD; do
            sed -i "s/^$name=.*/$name=ci-$name/" .env
          done
          docker compose config -q
          docker compose -f docker-compose.yml -f lab/manager.override.yml config -q
          docker compose --project-directory lab -f lab/docker-compose.yml --env-file "$PWD/.env" \
            --profile attack --profile validate config -q

  python:
    name: Testes da API e das integrações
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: python -m pytest -q api/tests tests/integrations tests/fim

  regras:
    name: Regras e decoders no Wazuh (wazuh-logtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manager do Wazuh com as regras do Reefed
        run: |
          docker run -d --name wazuh-manager -e TZ=America/Sao_Paulo \
            -v "$PWD/config/wazuh_manager:/reefed/manager:ro" \
            -v "$PWD/config/wazuh_manager/entrypoint:/entrypoint-scripts:ro" \
            -v "$PWD/wazuh:/reefed/wazuh:ro" \
            -v "$PWD/tests:/reefed/tests:ro" \
            "wazuh/wazuh-manager:$WAZUH_VERSION"

      - name: Espera o analysisd carregar as regras
        run: |
          for _ in $(seq 1 90); do
            if docker exec wazuh-manager test -S /var/ossec/queue/sockets/logtest; then exit 0; fi
            sleep 5
          done
          docker logs --tail 80 wazuh-manager
          exit 1

      - name: Testes (todas as janelas de horário)
        run: docker exec wazuh-manager /var/ossec/framework/python/bin/python3 /reefed/tests/run_tests.py --all-windows

      - name: Erros do Wazuh ao carregar as regras
        if: always()
        run: docker exec wazuh-manager grep -E "ERROR|CRITICAL" /var/ossec/logs/ossec.log | grep -vi "indexer\|filebeat\|resource limit\|vulnerab\|content" || true

  windows:
    name: Instalador do agente Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Análise estática (PSScriptAnalyzer, compatível com o PowerShell 5.1)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $results = 'agents/windows/install-agent.ps1', 'tests/windows/test-install-agent.ps1' |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings tests/windows/PSScriptAnalyzerSettings.psd1 }
          $results | Format-Table -AutoSize -Wrap ScriptName, Line, RuleName, Message
          if ($results) { exit 1 }

      - name: Testes das funções (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\windows\test-install-agent.ps1

      - name: Testes das funções (PowerShell 7)
        shell: pwsh
        run: ./tests/windows/test-install-agent.ps1

      # Sem servidor do Reefed o agente não se registra, mas o MSI, a assinatura, a
      # descoberta do PostgreSQL pelo serviço e o ossec.conf gerado são de verdade:
      # o agente só fica rodando se aceitar a configuração.
      - name: Instalação de verdade (MSI do Wazuh e PostgreSQL do runner)
        shell: powershell
        run: |
          .\agents\windows\install-agent.ps1 -Manager 127.0.0.1 -Password ci-senha -Database postgresql
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $conf = Get-Content -Raw "${env:ProgramFiles(x86)}\ossec-agent\ossec.conf"
          if ($conf -notmatch 'REEFED-LOCAL-BEGIN' -or $conf -notmatch '<location>[^<]+\\postgresql-\*\.log</location>') {
            Write-Host $conf
            exit 1
          }
          .\agents\windows\install-agent.ps1 -ConfigureOnly -Database mysql
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 15
          Get-Service -Name WazuhSvc, Wazuh -ErrorAction SilentlyContinue
          $log = "${env:ProgramFiles(x86)}\ossec-agent\ossec.log"
          Select-String -Path $log -Pattern 'ERROR|CRITICAL' | Select-Object -Last 30 | ForEach-Object { $_.Line }
          if (Select-String -Path $log -Pattern 'Configuration error|Invalid element|Invalid value|XMLERR') { exit 1 }

  laboratorio:
    name: Laboratório completo (ataques simulados)
    if: github.event_name == 'workflow_dispatch' && inputs.laboratorio
    needs: [arquivos, regras]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preparação (vm.max_map_count, .env, certificados)
        run: |
          sudo sysctl -w vm.max_map_count=262144
          ./setup.sh
      - name: Sobe o Reefed
        run: make up
      - name: Laboratório
        run: make lab
      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 100 wazuh.manager reefed-api reefed-init
