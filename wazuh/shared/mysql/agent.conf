<!--
  Reefed - grupo "mysql": servidor com MySQL 8.x.

  Logs (configure o MySQL com agents/database/mysql/reefed.cnf):
    error.log    falhas de login, início e parada do servidor
    slow.log     todos os comandos, com usuário, IP, erro e linhas devolvidas
                 (várias linhas por comando: multi-line-regex a partir de "# Time:")
    general.log  só as linhas Connect (novas sessões); o resto do general log
                 não diz quem executou o comando e fica de fora (restrict)

  Integridade (FIM): configuração em tempo real (110801), plugins (110802),
  chaves TLS do diretório de dados (110803) e os logs (110804).
  A verificação de skip-grant-tables (110056) é um comando local do agente,
  instalado pelo agents/linux/install-agent.sh (opção de banco mysql) ou pelo
  agents/windows/install-agent.ps1, porque comandos não podem vir da configuração
  centralizada do manager.
-->
<agent_config os="Linux">

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mysql/error.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mysqld.log</location>
  </localfile>

  <localfile>
    <log_format>multi-line-regex</log_format>
    <location>/var/log/mysql/slow.log</location>
    <multiline_regex match="start" replace="wspace" timeout="3">^# Time: </multiline_regex>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mysql/general.log</location>
    <restrict type="PCRE2">^\S+\s+\d+ Connect\t</restrict>
  </localfile>

  <syscheck>
    <directories realtime="yes" report_changes="yes">/etc/mysql,/etc/my.cnf.d</directories>
    <directories realtime="yes">/usr/lib/mysql/plugin,/usr/lib64/mysql/plugin</directories>
    <!-- Chaves TLS geradas pelo MySQL no diretório de dados. Varredura agendada:
         em tempo real o agente receberia cada escrita nos arquivos de dados. -->
    <directories recursion_level="0" restrict=".pem$">/var/lib/mysql</directories>
    <directories check_all="no" restrict=".log$">/var/log/mysql</directories>
    <directories check_all="no">/var/log/mysqld.log</directories>
  </syscheck>

</agent_config>

<!-- Windows: os caminhos mudam com a versão instalada e com o my.ini, então quem
     grava os logs, o FIM e a verificação de skip-grant-tables no ossec.conf do agente
     é o agents/windows/install-agent.ps1 (opção -Database mysql), que lê o my.ini do
     serviço do Windows. -->
