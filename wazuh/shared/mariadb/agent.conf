<!--
  Reefed - grupo "mariadb": servidor com MariaDB.

  Logs: o plugin server_audit registra logins, falhas e todos os comandos numa
  linha cada (configure com agents/database/mariadb/reefed.cnf).

  Integridade (FIM): configuração em tempo real (110801), plugins (110802),
  chaves TLS (110803) e os logs (110804). A verificação de skip-grant-tables
  (110056) é um comando local do agente, instalado pelo
  agents/linux/install-agent.sh (opção de banco mariadb) ou pelo
  agents/windows/install-agent.ps1.
-->
<agent_config os="Linux">

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mysql/server_audit.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mariadb/server_audit.log</location>
  </localfile>

  <syscheck>
    <directories realtime="yes" report_changes="yes">/etc/mysql,/etc/my.cnf.d</directories>
    <directories realtime="yes">/usr/lib/mysql/plugin,/usr/lib64/mysql/plugin,/usr/lib64/mariadb/plugin,/usr/lib/x86_64-linux-gnu/mariadb19/plugin,/usr/lib/aarch64-linux-gnu/mariadb19/plugin</directories>
    <directories recursion_level="0" restrict=".pem$">/var/lib/mysql</directories>
    <directories check_all="no" restrict=".log$">/var/log/mysql,/var/log/mariadb</directories>
  </syscheck>

</agent_config>

<!-- Windows: quem grava o log de auditoria, o FIM e a verificação de
     skip-grant-tables no ossec.conf do agente é o agents/windows/install-agent.ps1
     (opção -Database mariadb), que lê o my.ini do serviço do Windows. -->
