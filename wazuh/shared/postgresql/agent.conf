<!--
  Reefed - grupo "postgresql": servidor com PostgreSQL.

  Logs: o PostgreSQL precisa do log_line_prefix do Reefed
  (agents/database/postgresql/reefed.conf). Um comando que ocupa várias linhas
  vira um evento só (multi-line-regex: cada evento começa com data e hora).
  Os caminhos cobrem Debian/Ubuntu, RHEL (pacote da distribuição e do PGDG) e a
  imagem oficial do Docker; caminhos que não existem são ignorados pelo agente.

  Integridade (FIM): configuração e autenticação em tempo real (regras 110800 e
  110801), bibliotecas e extensões (110802), chaves TLS (110803) e os logs do
  banco, para saber se alguém apagou um log (110804, na varredura agendada).
-->
<agent_config os="Linux">

  <localfile>
    <log_format>multi-line-regex</log_format>
    <location>/var/log/postgresql/postgresql-*.log</location>
    <multiline_regex match="start" replace="wspace" timeout="3">^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}</multiline_regex>
  </localfile>

  <localfile>
    <log_format>multi-line-regex</log_format>
    <location>/var/lib/pgsql/data/log/postgresql-*.log</location>
    <multiline_regex match="start" replace="wspace" timeout="3">^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}</multiline_regex>
  </localfile>

  <localfile>
    <log_format>multi-line-regex</log_format>
    <location>/var/lib/pgsql/*/data/log/postgresql-*.log</location>
    <multiline_regex match="start" replace="wspace" timeout="3">^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}</multiline_regex>
  </localfile>

  <localfile>
    <log_format>multi-line-regex</log_format>
    <location>/var/lib/postgresql/data/log/postgresql-*.log</location>
    <multiline_regex match="start" replace="wspace" timeout="3">^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}</multiline_regex>
  </localfile>

  <syscheck>
    <!-- Debian/Ubuntu: postgresql.conf, pg_hba.conf, pg_ident.conf e conf.d -->
    <directories realtime="yes" report_changes="yes">/etc/postgresql</directories>

    <!-- Configuração dentro do diretório de dados (RHEL, PGDG, Docker, o
         postgresql.auto.conf do ALTER SYSTEM e o reefed.conf incluído). Só os arquivos
         de configuração e as chaves TLS, sem descer nas pastas de dados. -->
    <directories realtime="yes" report_changes="yes" recursion_level="0" restrict="postgresql.conf$|postgresql.auto.conf$|pg_hba.conf$|pg_ident.conf$|reefed.conf$|server.key$|server.crt$">/var/lib/pgsql/data,/var/lib/pgsql/*/data,/var/lib/postgresql/data,/var/lib/postgresql/*/main</directories>
    <!-- Chave privada: avisa da troca, mas nunca manda o conteúdo para o manager -->
    <nodiff type="sregex">server.key$</nodiff>

    <!-- Bibliotecas e extensões: uma .so nova aqui é código rodando dentro do banco -->
    <directories realtime="yes">/usr/lib/postgresql,/usr/pgsql-*/lib,/usr/lib64/pgsql</directories>
    <directories realtime="yes">/usr/share/postgresql/*/extension,/usr/pgsql-*/share/extension,/usr/share/pgsql/extension</directories>

    <!-- Logs ativos (os girados, .log.1 e .gz, ficam de fora) -->
    <directories check_all="no" restrict=".log$">/var/log/postgresql,/var/lib/pgsql/data/log,/var/lib/pgsql/*/data/log,/var/lib/postgresql/data/log</directories>
  </syscheck>

</agent_config>

<!-- Windows: os caminhos mudam com a versão instalada, então quem grava os logs e o
     FIM do PostgreSQL no ossec.conf do agente é o agents/windows/install-agent.ps1
     (opção -Database postgresql), que acha a instalação pelo serviço do Windows. -->
