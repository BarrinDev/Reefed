<!--
  Reefed - grupo "linux": todo servidor Linux, inclusive o do banco.

  Logs de sistema, autenticação (sshd, sudo, su, login) e do firewall do kernel
  (UFW, iptables, firewalld) já são lidos pela configuração padrão do agente:
  journald nas distribuições com systemd, ou /var/log/auth.log, secure, syslog,
  messages e kern.log nas outras. Repetir esses arquivos aqui duplicaria os
  eventos, então este grupo só acrescenta o que falta.
-->
<agent_config os="Linux">

  <!-- auditd, quando estiver instalado: comandos executados e mudanças em contas -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Integridade em tempo real dos arquivos que controlam o acesso ao servidor -->
  <syscheck>
    <directories realtime="yes" report_changes="yes" restrict="sshd_config">/etc/ssh</directories>
    <directories realtime="yes" report_changes="yes">/etc/sudoers.d</directories>
    <directories realtime="yes" report_changes="yes" restrict="authorized_keys">/root/.ssh</directories>
  </syscheck>

</agent_config>
