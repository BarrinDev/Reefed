<!--
  Reefed - grupo "app": servidor da aplicação que grava os eventos do sistema num
  arquivo, uma linha JSON por evento (alternativa ao POST /api/v1/events, veja
  docs/integracao.md). Exemplo de grupos: linux,app

  Formato de cada linha (o mesmo que a API monta):
    {"reefed":{"source":"app","app":"loja","event":"login_failed","message":"senha incorreta"},"srcip":"203.0.113.7","dstuser":"ana"}
-->
<agent_config>
  <labels>
    <label key="reefed.role">app</label>
  </labels>
</agent_config>

<agent_config os="Linux">
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/reefed/eventos.json</location>
  </localfile>
</agent_config>

<agent_config os="Windows">
  <localfile>
    <log_format>json</log_format>
    <location>C:\reefed\eventos.json</location>
  </localfile>
</agent_config>
