<!--
  Reefed - grupo "database": servidores de banco (junto com o grupo do banco:
  postgresql, mysql ou mariadb). Exemplo de grupos: linux,database,postgresql

  Os logs e os arquivos de cada banco ficam no grupo do banco. Aqui ficam o
  rótulo que identifica o servidor nos alertas e a proteção da configuração do
  próprio agente (regra 110805).
-->
<agent_config>
  <labels>
    <label key="reefed.role">database</label>
  </labels>
</agent_config>

<agent_config os="Linux">
  <syscheck>
    <directories realtime="yes" recursion_level="0" restrict="ossec.conf$|local_internal_options.conf$|client.keys$">/var/ossec/etc</directories>
  </syscheck>
</agent_config>

<!-- No Windows a varredura é agendada: o próprio agente escreve o ossec.log nessa pasta -->
<agent_config os="Windows">
  <syscheck>
    <directories recursion_level="0" restrict="ossec.conf$|local_internal_options.conf$|client.keys$">C:\Program Files (x86)\ossec-agent</directories>
  </syscheck>
</agent_config>
