<!--
  Reefed - grupo "windows": todo servidor Windows, inclusive o do banco.

  Os canais Security, System e Application já vêm na configuração padrão do
  agente. Este grupo acrescenta o firewall, o Defender, o PowerShell, o RDP e o
  Sysmon (se estiver instalado; sem ele o agente só avisa uma vez no log).
-->
<agent_config os="Windows">

  <!-- Firewall do Windows: regras criadas, alteradas ou apagadas e perfil desligado -->
  <localfile>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Conexões bloqueadas pelo firewall. O install-agent.ps1 liga esse log:
       netsh advfirewall set allprofiles logging droppedconnections enable -->
  <localfile>
    <location>C:\Windows\System32\LogFiles\Firewall\pfirewall.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
