# Reefed - log do PostgreSQL no formato que o Reefed entende.
#
# Onde colocar:
#   Debian/Ubuntu: /etc/postgresql/<versão>/main/conf.d/reefed.conf
#   RHEL/PGDG:     no diretório de dados (ex.: /var/lib/pgsql/17/data/reefed.conf)
#                  e no postgresql.conf: include_if_exists = 'reefed.conf'
#   Windows:       C:\Program Files\PostgreSQL\<versão>\data\reefed.conf, com o mesmo
#                  include_if_exists no postgresql.conf
# Depois: sudo systemctl reload postgresql (todas as opções abaixo aceitam reload)
#
# O arquivo de log continua onde a sua instalação já grava: no Debian/Ubuntu,
# /var/log/postgresql/postgresql-<versão>-main.log; no RHEL e no Windows,
# a pasta "log" dentro do diretório de dados. O grupo "postgresql" do Reefed lê
# esses caminhos.

# Prefixo de cada linha: data, PID, usuário, banco, cliente e aplicação.
# Os decoders do Reefed dependem exatamente deste formato.
log_line_prefix = '%m [%p] user=%u db=%d client=%h app=%a '

# Logins aceitos, recusados e fim de sessão
log_connections = on
log_disconnections = on

# Todos os comandos (base das regras de SQL injection, DDL, privilégios e exportação).
# Em banco com muito movimento, 'ddl' reduz o volume, mas desliga as regras que
# olham SELECT, INSERT, UPDATE e DELETE.
log_statement = 'all'

# Comando que deu erro aparece junto do erro (SQL injection por tentativa e erro)
log_min_error_statement = error

# IP em vez de nome no campo client= (as listas do Reefed usam IP)
log_hostname = off
